# Deploy hub (index + static docs) + built study-game to GitHub Pages.
#
# Setup: Repo → Settings → Pages → Build and deployment → Source: GitHub Actions
# URL: https://<user>.github.io/<repo>/
# Game: https://<user>.github.io/<repo>/study-game/dist/ (build uses relative asset URLs)

name: Deploy Study Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: study-game/package-lock.json

      # Relative base so script URLs resolve from …/study-game/dist/index.html → …/dist/assets/…
      # (Absolute /repo/... paths break if the build on Pages is stale or the repo is renamed.)
      - name: Build Vite app
        run: |
          cd study-game
          npm ci
          python3 scripts/parse_content.py
          npx vite build --base=./

      - name: Assemble site (hub + docs + game)
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp -R adm-prep site/
          cp -R cursor-product site/
          mkdir -p site/study-game/dist
          cp -R study-game/dist/. site/study-game/dist/
          # Repo study-game/index.html is the Vite dev entry (/src/main.jsx) — replace with redirect to the built app
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta http-equiv="refresh" content="0;url=dist/"/><title>ADM Study Game</title></head><body><p><a href="dist/">Open ADM Study Game</a></p></body></html>' > site/study-game/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
